[package]
name = "keystone-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
futures = "0.3.34"
getrandom = "0.4"
portable-pty = "0.9.0"
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.29.1", features = ["v4", "serde"] }
zeroize = { version = "1.9.1", features = ["derive"] }
zxcvbn = "3.1.1"

[dev-dependencies]
tempfile = "3.27.0"
